<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Switch Video Player — Video senkronizasyon ekranı.">
    <title>Senkronizasyon — Switch Player</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .sync-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 900px;
            margin: 0 auto;
        }

        
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }

        @media (max-width: 640px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-slot {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .preview-slot-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .preview-video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--c-border);
        }

        .preview-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .offset-section {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-xl);
        }

        .offset-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-lg);
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .offset-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            color: var(--c-text);
        }

        .offset-subtitle {
            font-size: 0.78rem;
            color: var(--c-text-dim);
            margin-top: 2px;
        }

        .offset-display {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .offset-step-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--c-surface-3);
            border: 1px solid var(--c-border-2);
            color: var(--c-text);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--t-fast);
            user-select: none;
        }

        .offset-step-btn:hover {
            background: var(--c-accent);
            border-color: var(--c-accent);
        }

        .offset-step-btn:active {
            transform: scale(0.92);
        }

        .offset-value-display {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            color: var(--c-text);
            min-width: 90px;
            text-align: center;
        }

        .offset-unit {
            font-size: 0.75rem;
            color: var(--c-text-dim);
            display: block;
            text-align: center;
            letter-spacing: 0.08em;
        }

        .offset-desc {
            font-size: 0.78rem;
            color: var(--c-text-dim);
            margin-top: var(--space-sm);
            text-align: center;
        }

        .offset-fine {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .offset-input {
            background: var(--c-surface);
            border: 1px solid var(--c-border-2);
            border-radius: var(--radius-md);
            color: var(--c-text);
            font-family: var(--font-heading);
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
            width: 120px;
            text-align: center;
            outline: none;
        }

        .offset-input:focus {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px var(--c-accent-glow);
        }

        
        .play-controls {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: var(--space-md);
        }

        
        .audio-section {
            margin-bottom: var(--space-xl);
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--c-border);
        }
    </style>
</head>

<body>
    
    <nav class="navbar" role="navigation" aria-label="Ana navigasyon">
        <div class="navbar-brand" onclick="goBack()" role="link" tabindex="0"
            onkeydown="if(event.key==='Enter')goBack()" aria-label="Geri dön">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Geri
        </div>
        <div class="navbar-brand" style="cursor:default; pointer-events:none;">
            <img src="assets/img/logo.png" alt="Switch Player" style="height:40px; width:auto; object-fit:contain; display:block;">
        </div>
        <div style="width:80px;"></div>
    </nav>

    <main class="page-content">
        
        <div class="step-indicator" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="3"
            aria-label="Adım 2 / 3: Senkronizasyon">
            <div class="step done">
                <div class="step-num">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>
                <span>Kaynak</span>
            </div>
            <div class="step-connector done"></div>
            <div class="step active">
                <div class="step-num">2</div>
                <span>Senkronizasyon</span>
            </div>
            <div class="step-connector"></div>
            <div class="step">
                <div class="step-num">3</div>
                <span>Hazır</span>
            </div>
        </div>

        <div class="sync-card" role="main" aria-label="Senkronizasyon ayarları">
            <div class="section-header" style="margin-bottom:var(--space-lg)">
                <div>
                    <h1 class="section-title">Senkronizasyon</h1>
                    <p class="section-subtitle" id="pairTitleDisplay">—</p>
                </div>
            </div>

            
            <div class="preview-grid">
                <div class="preview-slot">
                    <div class="preview-slot-label">
                        <div class="slot-num" style="width:20px;height:20px;font-size:0.65rem;flex-shrink:0;"
                            aria-hidden="true">1</div>
                        Video 1 — Açı A
                    </div>
                    <div class="preview-video-wrap">
                        <video id="prevVideo1" playsinline preload="metadata" aria-label="Video 1 önizleme"></video>
                    </div>
                </div>
                <div class="preview-slot">
                    <div class="preview-slot-label">
                        <div class="slot-num" style="width:20px;height:20px;font-size:0.65rem;flex-shrink:0;"
                            aria-hidden="true">2</div>
                        Video 2 — Açı B
                    </div>
                    <div class="preview-video-wrap">
                        <video id="prevVideo2" playsinline preload="metadata" aria-label="Video 2 önizleme"></video>
                    </div>
                </div>
            </div>

            
            <div class="offset-section">
                <div class="offset-header">
                    <div>
                        <div class="offset-title">Offset Ayarı</div>
                        <div class="offset-subtitle">Video 2'nin Video 1'e göre ne kadar gecikmeli başlaması gerektiğini
                            ayarlayın</div>
                    </div>
                    <div class="play-controls">
                        <button class="btn btn-secondary" id="seekBack10" title="-10 saniye"
                            aria-label="10 saniye geri">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="1 4 1 10 7 10" />
                                <path d="M3.51 15a9 9 0 1 0 .49-3.76" />
                                <text x="5" y="15" font-size="7" fill="currentColor" stroke="none"
                                    font-family="sans-serif">10</text>
                            </svg>
                            -10s
                        </button>
                        <button class="btn btn-primary" id="togglePlayBtn" aria-label="Oynat / Duraklat">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="playIcon"
                                aria-hidden="true">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon"
                                class="hidden" aria-hidden="true">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                            <span id="playBtnText">Oynat</span>
                        </button>
                        <button class="btn btn-secondary" id="seekFwd10" title="+10 saniye"
                            aria-label="10 saniye ileri">
                            +10s
                        </button>
                    </div>
                </div>

                
                <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-md);">
                    <div class="offset-display">
                        <button class="offset-step-btn" id="offsetDown" aria-label="Offset azalt (-0.5s)">−</button>
                        <div>
                            <div class="offset-value-display" id="offsetDisplay">0.0</div>
                            <span class="offset-unit">saniye</span>
                        </div>
                        <button class="offset-step-btn" id="offsetUp" aria-label="Offset artır (+0.5s)">+</button>
                    </div>

                    <div class="offset-fine">
                        <label for="offsetInput" class="form-label" style="white-space:nowrap; margin:0;">İnce ayar
                            (s):</label>
                        <div style="display:flex; align-items:center; gap: 4px;">
                            <button class="offset-step-btn"
                                style="width:28px; height:28px; font-size:1rem; border-radius: var(--radius-sm);"
                                onclick="document.getElementById('offsetInput').stepDown(); document.getElementById('offsetInput').dispatchEvent(new Event('input'))"
                                aria-label="İnce ayar azalt">-</button>
                            <input type="number" id="offsetInput" class="offset-input" value="0.0" step="0.1"
                                min="-3600" max="3600" aria-label="Offset değeri saniye cinsinden">
                            <button class="offset-step-btn"
                                style="width:28px; height:28px; font-size:1rem; border-radius: var(--radius-sm);"
                                onclick="document.getElementById('offsetInput').stepUp(); document.getElementById('offsetInput').dispatchEvent(new Event('input'))"
                                aria-label="İnce ayar artır">+</button>
                        </div>
                    </div>

                    <p class="offset-desc" id="offsetDesc">Video 2, Video 1 ile aynı anda başlar</p>
                </div>
            </div>

            
            <div class="audio-section">
                <p class="form-label mb-md">Ses Kaynağı</p>
                <div class="radio-group" role="radiogroup" aria-label="Ses kaynağı seçimi">
                    <label class="radio-card">
                        <input type="radio" name="audioSource" value="1" checked>
                        <div class="radio-card-dot"></div>
                        <div>
                            <div style="font-weight:600; font-size:0.875rem;">Video 1 Sesi</div>
                            <div style="font-size:0.75rem; color:var(--c-text-dim);">Açı A</div>
                        </div>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="audioSource" value="2">
                        <div class="radio-card-dot"></div>
                        <div>
                            <div style="font-weight:600; font-size:0.875rem;">Video 2 Sesi</div>
                            <div style="font-size:0.75rem; color:var(--c-text-dim);">Açı B</div>
                        </div>
                    </label>
                </div>
            </div>

            
            <div class="footer-actions">
                <button class="btn btn-ghost" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                    Geri
                </button>
                <button class="btn btn-primary btn-lg" id="confirmBtn" onclick="confirmSync()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    Kaydet ve Başla
                </button>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="js/storage.js"></script>
    <script src="js/gdrive.js"></script>
    <script>
        applyUiScale();

        let pair = null;
        let offset = 0;
        let isPaused = true;

        const v1 = document.getElementById('prevVideo1');
        const v2 = document.getElementById('prevVideo2');

        function init() {
            const raw = sessionStorage.getItem('svp-temp-pair');
            if (!raw) { location.href = 'add-video.html'; return; }

            pair = JSON.parse(raw);
            document.getElementById('pairTitleDisplay').textContent = pair.title;

            v1.src = pair.video1.src;
            v2.src = pair.video2.src;

            v2.muted = true;

            v1.load();
            v2.load();

            if (pair.syncOffset) {
                offset = pair.syncOffset;
                updateOffsetUI();
            }
        }

        function updateOffsetUI() {
            const d = document.getElementById('offsetDisplay');
            const i = document.getElementById('offsetInput');
            d.textContent = offset.toFixed(1);
            i.value = offset.toFixed(1);

            let desc = '';
            if (offset === 0) {
                desc = 'Video 2, Video 1 ile aynı anda başlar';
            } else if (offset > 0) {
                desc = `Video 2, Video 1'den ${offset.toFixed(1)}s gecikmeli başlar`;
            } else {
                desc = `Video 2, Video 1'den ${Math.abs(offset).toFixed(1)}s önce başlar`;
            }
            document.getElementById('offsetDesc').textContent = desc;

            if (isPaused) {

                const minExpectedV1Time = Math.max(0, offset);

                if (v1.currentTime < minExpectedV1Time) {
                    v1.currentTime = minExpectedV1Time;
                }

                const t2 = Math.max(0, v1.currentTime - offset);
                v2.currentTime = t2;
            }
        }

        document.getElementById('offsetUp').addEventListener('click', () => {
            offset = Math.round((offset + 0.5) * 10) / 10;
            updateOffsetUI();
        });

        document.getElementById('offsetDown').addEventListener('click', () => {
            offset = Math.round((offset - 0.5) * 10) / 10;
            updateOffsetUI();
        });

        document.getElementById('offsetInput').addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                offset = val;
                updateOffsetUI();
            }
        });

        document.getElementById('togglePlayBtn').addEventListener('click', togglePlay);

        function togglePlay() {
            if (isPaused) {

                const t1 = v1.currentTime;
                const t2 = Math.max(0, t1 - offset);
                v2.currentTime = t2;
                v1.play();
                v2.play();
                isPaused = false;
                document.getElementById('playIcon').classList.add('hidden');
                document.getElementById('pauseIcon').classList.remove('hidden');
                document.getElementById('playBtnText').textContent = 'Duraklat';
            } else {
                v1.pause();
                v2.pause();
                isPaused = true;
                document.getElementById('playIcon').classList.remove('hidden');
                document.getElementById('pauseIcon').classList.add('hidden');
                document.getElementById('playBtnText').textContent = 'Oynat';
                updateOffsetUI();
            }
        }

        document.getElementById('seekBack10').addEventListener('click', () => {
            v1.currentTime = Math.max(0, v1.currentTime - 10);
            v2.currentTime = Math.max(0, v1.currentTime - offset);
        });

        document.getElementById('seekFwd10').addEventListener('click', () => {
            v1.currentTime = v1.currentTime + 10;
            v2.currentTime = Math.max(0, v1.currentTime - offset);
        });

        function confirmSync() {
            v1.pause(); v2.pause();

            const audioSource = parseInt(
                document.querySelector('input[name="audioSource"]:checked').value
            );

            pair.syncOffset = offset;
            pair.audioSource = audioSource;

            saveVideoPair(pair);
            sessionStorage.removeItem('svp-temp-pair');

            location.href = `index.html`;
        }

        function goBack() {
            location.href = 'add-video.html';
        }

        init();
    </script>
</body>

</html>
